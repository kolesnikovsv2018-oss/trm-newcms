name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, gd, mbstring, iconv, xml
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint PHP files
        run: git ls-files '*.php' | xargs -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PSR-4 completeness check
        run: php tools/check-classes.php .

      - name: Architecture gate (no legacy local-copies paths)
        run: |
          if git grep -n 'site/trm' -- '*.php'; then
            echo 'NewCMS must not reference site local copies' >&2
            exit 1
          fi
